name: PDF report

on:
  workflow_run:
    workflows: [PDF]
    types: [completed]

# This job never checks out or executes code from a pull request.
permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download the diagnostic text
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-report
          path: ${{ runner.temp }}/build-report
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Comment on the pull request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REPORT_PATH: ${{ runner.temp }}/build-report/diagnostics.txt
        with:
          script: |
            const fs = await import('node:fs');
            const run = context.payload.workflow_run;
            const {owner, repo} = context.repo;
            let prs = run.pull_requests || [];
            if (!prs.length) {
              const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: run.head_sha
              });
              prs = response.data.filter(pr =>
                pr.base.repo.full_name === `${owner}/${repo}` && pr.head.sha === run.head_sha);
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {owner, repo, run_id: run.id});
            const link = name => {
              const artifact = artifacts.filter(a => a.name === name && !a.expired)
                .sort((a, b) => b.id - a.id)[0];
              return artifact && `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${run.id}/artifacts/${artifact.id}`;
            };
            const ok = run.conclusion === 'success';
            const marker = `<!-- pdf-build:${run.id} -->`;
            let body = `${marker}\n**PDF: ${ok ? 'сборка и проверки пройдены' : 'сборка или проверки не пройдены'}** (${run.head_sha.slice(0, 7)}).\n\n`;
            if (ok && link('pdf')) {
              body += `[Скачать артефакт с двумя PDF (ZIP)](${link('pdf')}).\n\n`;
            }
            body += `[Открыть сборку](${run.html_url})`;
            if (link('build-logs')) body += ` · [Скачать полные логи](${link('build-logs')})`;
            if (!ok && fs.existsSync(process.env.REPORT_PATH)) {
              const fd = fs.openSync(process.env.REPORT_PATH, 'r');
              let excerpt;
              try {
                const size = fs.fstatSync(fd).size;
                const buffer = Buffer.alloc(Math.min(size, 6000));
                const length = fs.readSync(fd, buffer, 0, buffer.length, Math.max(0, size - buffer.length));
                excerpt = buffer.subarray(0, length).toString('utf8').replace(/`/g, "'");
              } finally {
                fs.closeSync(fd);
              }
              body += `\n\n<details><summary>Последние сообщения сборки</summary>\n\n\`\`\`text\n${excerpt}\n\`\`\`\n</details>`;
            }
            for (const pr of prs) {
              const comments = await github.paginate(github.rest.issues.listComments,
                {owner, repo, issue_number: pr.number});
              const previous = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes(marker));
              if (previous) {
                await github.rest.issues.updateComment({owner, repo, comment_id: previous.id, body});
              } else {
                await github.rest.issues.createComment({owner, repo, issue_number: pr.number, body});
              }
            }
