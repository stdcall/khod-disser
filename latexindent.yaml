defaultIndent: "    "
removeTrailingWhitespace:
    afterProcessing: 1
modifyLineBreaks:
    preserveBlankLines: 1
    condenseMultipleBlankLinesInto: 1
    textWrapOptions:
        columns: 80
        blocksFollow:
            # Первый абзац окружения переносится и без отдельного комментария %.
            # Сохраняем штатные правила для \] и \item; учитываем \cite[...] в заголовке.
            other: |-
                \\\]|\\item(?:\h|\[)
                |\\begin\{(?:theorem|lemma|proof|proposition|corollary|remark|definition)\}
                (?:\h*\[(?:[^\[\]\r\n]|\[[^\[\]\r\n]*\])*\])?
                (?:(?:\h|\R)*\\label\{[^}\r\n]*\})*
        blocksBeginWith:
            A-Z: 1
            a-z: 1
            0-9: 0
            other: "[АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдеёжзийклмнопрстуфхцчшщъыьэюя]"
noAdditionalIndentGlobal:
    optionalArguments: 1
    namedGroupingBracesBrackets: 1
specialBeginEnd:
    - amalgamate: 1
    - name: inlineMath
      lookForThis: 0
